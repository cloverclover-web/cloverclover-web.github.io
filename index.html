<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#faf3e8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="YOYO Story Worlds">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>YOYO Story Worlds</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <!-- ?v= is the version these files belong to. A worker still running the
         previous version matches on the full URL, misses, and goes to the
         network, so the first render after an update is already the new code.
         service-worker.js strips the query before it touches the cache, so
         offline still finds the precached copy. -->
    <link rel="stylesheet" href="story.css?v=2026-09-14-library-reader-r22">
    <link rel="stylesheet" href="library.css?v=2026-09-14-library-reader-r22">
    <!-- Loaded before the app so a stale script can never block its own
         replacement. See sw-bootstrap.js. -->
    <script src="sw-bootstrap.js?v=2026-09-14-library-reader-r22"></script>
    <link rel="stylesheet" href="offline-library.css">
</head>
  <body>
    <div class="library">

      <!-- ============ THE SHELF ============ -->
      <main class="view is-active" data-view="shelf" aria-label="Story worlds">
        <header class="library-top">
          <svg class="library-crest" viewBox="0 0 80 60" aria-hidden="true">
            <path d="M14 50 V14 Q26 8 40 14 V50 Q26 44 14 50 Z"
                  fill="#faf3e8" stroke="#b98f42" stroke-width="2.4" stroke-linejoin="round"/>
            <path d="M66 50 V14 Q54 8 40 14 V50 Q54 44 66 50 Z"
                  fill="#faf3e8" stroke="#b98f42" stroke-width="2.4" stroke-linejoin="round"/>
            <path d="M40 14 V50" stroke="#b98f42" stroke-width="2.4" stroke-linecap="round"/>
            <circle cx="27" cy="26" r="2.4" fill="#e8a0b4"/>
            <circle cx="53" cy="26" r="2.4" fill="#a3b89a"/>
          </svg>
          <h1 class="library-title">YOYO Story Worlds</h1>
          <p class="library-invite">Where shall we go today?</p>
          <!-- Sized to what can really be opened: filled in by library.js from
               the ready-story list, and absent altogether when nothing is. -->
          <div class="quick-read" id="quickRead"></div>
        </header>

        <!-- Stories that can be opened but are not finished books. The
             parent went looking for the latest Tower reading after coming
             home and could not find it, so it is here on the shelf itself,
             above the categories, saying plainly what it is. library.js
             fills this in from the preview list and removes the whole
             section when that list is empty. -->
        <section class="previews" id="previewSection" aria-labelledby="previewsTitle" hidden>
          <h2 class="previews-title" id="previewsTitle">Story previews</h2>
          <p class="previews-note">
            Read these previews together. Each book tells you what is ready to try.
          </p>
          <div class="card-grid card-grid-previews" id="previewRow"></div>
        </section>

        <div class="card-grid" id="categoryGrid"></div>

        <footer class="library-foot">
          <a class="btn btn-quiet" href="picnic.html">For grown-ups</a>
        </footer>
      </main>

      <!-- ============ ONE CATEGORY ============ -->
      <main class="view" data-view="category" aria-label="One story world">
        <header class="library-top is-compact">
          <a class="btn btn-quiet" id="categoryBack" href="./">Back to the library</a>
          <h1 class="library-title" id="categoryTitle" tabindex="-1"></h1>
          <p class="library-invite" id="categoryBlurb"></p>
        </header>

        <div class="card-grid" id="categoryBooks"></div>
      </main>

    </div>

    <noscript>
      <p class="quiet-note">
        This library needs JavaScript. You can still open
        <a href="picnic.html">Bunny's Birthday Picnic</a> or
        <a href="my-stories.html">My Stories</a> directly.
      </p>
    </noscript>

    <script src="library-data.js?v=2026-09-14-library-reader-r22"></script>
    <script src="library.js?v=2026-09-14-library-reader-r22"></script>
      <section id="offline-library" aria-label="Offline reading"></section>
    <script src="offline-library.js"></script>
</body>
</html>
